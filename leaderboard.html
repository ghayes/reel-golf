<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Golf — Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
<script src="vendor/supabase-js-2.117.2.umd.js"></script>
<script src="api.js?v=20261005a"></script>
<style>
  :root{
    --pine:#16281F; --water:#0F4C52; --deep:#072E33;
    --amber:#FFC978; --cream:#F7F3E7; --rust:#C4502E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;background:var(--pine);
    font-family:'Staatliches','Arial Narrow',Arial,sans-serif;color:var(--cream);}
  .wrap{max-width:640px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-size:min(14vw,54px);letter-spacing:.06em;color:var(--amber);text-align:center;line-height:.95;}
  h1 span{color:var(--cream);}
  nav{display:flex;justify-content:center;gap:18px;margin:14px 0 34px;
    font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;flex-wrap:wrap;}
  nav a{color:rgba(247,243,231,.65);text-decoration:none;border-bottom:1px solid transparent;}
  nav a:hover, nav a.active{color:var(--amber);border-color:var(--amber);}
  .state{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:13px;
    opacity:.7;margin:40px 0;}
  table{width:100%;border-collapse:collapse;font-family:ui-monospace,Menlo,monospace;font-size:13px;}
  thead th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    opacity:.55;padding:0 10px 8px;font-weight:normal;}
  thead th.num, tbody td.num{text-align:right;}
  tbody tr{background:rgba(247,243,231,.05);}
  tbody tr:nth-child(odd){background:rgba(247,243,231,.09);}
  tbody td{padding:10px;vertical-align:middle;}
  tbody tr td:first-child{border-radius:6px 0 0 6px;}
  tbody tr td:last-child{border-radius:0 6px 6px 0;}
  .rank{font-family:'Staatliches',sans-serif;font-size:18px;color:var(--amber);width:2em;}
  .rank.top1{color:#FFE29A;} .rank.top2{color:#E6D2B0;} .rank.top3{color:#D2A06A;}
  .uname{color:var(--cream);font-weight:bold;}
  td.num{color:rgba(247,243,231,.85);}
  .score{color:var(--amber);font-weight:bold;}
  .pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px;
    font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.06em;}
  .pager button{font:inherit;color:var(--pine);background:var(--amber);border:none;
    border-radius:5px;padding:7px 16px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;}
  .pager button:disabled{opacity:.35;cursor:default;}
  .pager .pageNum{opacity:.7;}
</style>
</head>
<body>
<div class="wrap">
  <h1>REEL GOLF <span>LEADERBOARD</span></h1>
  <nav>
    <a href="index.html">Play</a>
    <a href="leaderboard.html" class="active">Leaderboard</a>
    <a href="trophy-wall.html">Trophy Wall</a>
    <a href="changelog.html">Changelog</a>
    <a href="sms-opt-in.html">SMS Opt-In</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </nav>
  <div id="content"><div class="state">Loading scores&hellip;</div></div>
</div>
<script src="leaderboard.js?v=20261007b"></script>
</body>
</html>
