<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Golf — Trophy Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
<script src="vendor/supabase-js-2.117.2.umd.js"></script>
<script src="api.js?v=20261005a"></script>
<style>
  :root{
    --pine:#16281F; --water:#0F4C52; --deep:#072E33;
    --amber:#FFC978; --cream:#F7F3E7; --rust:#C4502E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;background:var(--pine);
    font-family:'Staatliches','Arial Narrow',Arial,sans-serif;color:var(--cream);}
  .wrap{max-width:720px;margin:0 auto;padding:32px 20px 60px;}
  h1{font-size:min(14vw,54px);letter-spacing:.06em;color:var(--amber);text-align:center;line-height:.95;}
  h1 span{color:var(--cream);}
  nav{display:flex;justify-content:center;gap:18px;margin:14px 0 30px;
    font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.1em;
    text-transform:uppercase;flex-wrap:wrap;}
  nav a{color:rgba(247,243,231,.65);text-decoration:none;border-bottom:1px solid transparent;}
  nav a:hover, nav a.active{color:var(--amber);border-color:var(--amber);}
  .state{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:13px;
    opacity:.7;margin:40px 0;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:34px;
    padding:16px;background:rgba(247,243,231,.05);border-radius:10px;}
  .legend .badge{display:flex;align-items:center;gap:6px;font-family:ui-monospace,Menlo,monospace;
    font-size:11px;background:rgba(247,243,231,.06);padding:6px 10px;border-radius:20px;}
  .legend .icon{font-size:16px;}
  .card{background:rgba(247,243,231,.06);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .card .head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
  .card .uname{font-family:'Staatliches',sans-serif;font-size:22px;color:var(--cream);}
  .card .stats{font-family:ui-monospace,Menlo,monospace;font-size:11px;opacity:.6;}
  .badges{display:flex;flex-wrap:wrap;gap:8px;}
  .badge-slot{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;
    font-family:ui-monospace,Menlo,monospace;font-size:11px;background:rgba(247,243,231,.05);
    filter:grayscale(1);opacity:.3;}
  .badge-slot.earned{filter:none;opacity:1;background:rgba(255,201,120,.15);
    border:1px solid rgba(255,201,120,.4);}
  .badge-slot .icon{font-size:15px;}
  .hidden{display:none !important;}
  button {
    padding: 10px 20px;
    cursor: pointer;
    background: rgba(247, 243, 231, 0.1);
    color: var(--cream);
    border: 1px solid var(--amber);
    border-radius: 6px;
    font-family: 'Staatliches', sans-serif;
    font-size: 14px;
    transition: all 0.2s;
  }
  button.active {
    background: var(--amber);
    color: var(--pine);
    font-weight: bold;
  }
  button:hover:not(.active) {
    background: rgba(255, 201, 120, 0.2);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>REEL GOLF <span>TROPHY WALL</span></h1>
  <nav>
    <a href="index.html">Play</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="trophy-wall.html" class="active">Trophy Wall</a>
    <a href="changelog.html">Changelog</a>
    <a href="sms-opt-in.html">SMS Opt-In</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </nav>
  <div id="content">
    <nav style="margin-bottom:20px; display:flex; justify-content:center; gap:10px;">
      <button id="viewGrid" class="active">Trophy Grid</button>
      <button id="viewHistory">History Timeline</button>
    </nav>
    <div id="trophyGrid"></div>
    <div id="trophyHistory" class="hidden"></div>
  </div>
</div>
<script src="trophy-wall.js?v=20261007a"></script>
</body>
</html>
